<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Home · Control de Gastos</title><meta name="theme-color" content="#f46b16">
<style>
:root{--ink:#251b15;--muted:#766c66;--line:#eee3dc;--orange:#f46b16;--cream:#fff7f1;--bg:#fffaf7;--white:#fff;--green:#197657}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--orange)}.app{max-width:980px;margin:auto;padding:20px 16px 80px}
.brand{display:flex;align-items:center;gap:15px;background:white;border:1px solid var(--line);border-radius:22px;padding:10px 16px;box-shadow:0 5px 25px #6e36100b}
.brand img{width:102px;height:83px;object-fit:contain}.brand h1{font-size:20px;margin:0;line-height:1.2}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.navBtn{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 15px;font-weight:650;color:var(--ink)}.navBtn.active{background:var(--ink);color:#fff}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:19px;padding:20px;background:white;box-shadow:0 3px 14px #6e361007}
.metric{background:var(--cream);border:1px solid #ffe4d3}.eyebrow{font-size:12px;color:var(--muted);font-weight:650}.amount{font-size:38px;font-weight:800;letter-spacing:-1.5px}.metricval{font-size:26px;font-weight:750}
h2{font-size:21px;margin:2px 0 15px}h3{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.mt{margin-top:18px}
.btn{background:var(--orange);color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.btn.secondary{background:white;border:1px solid #e4cbbd;color:var(--ink)}.btn.danger{background:#fff0ef;color:#a52623}.btn:disabled{opacity:.6;cursor:not-allowed}
.tablewrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:middle}th{font-size:12px;color:var(--muted)}td.money,th.money{text-align:right;white-space:nowrap}
label{font-size:12px;font-weight:700;color:#4d4038;display:block;margin-bottom:5px}input,select,textarea{display:block;width:100%;background:#fff;border:1px solid #ded4cd;border-radius:10px;padding:11px;color:var(--ink);min-height:43px}input:focus,select:focus{outline:2px solid #f9b585}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.item-row{display:grid;grid-template-columns:minmax(140px,2fr) 70px 95px 95px 40px;gap:8px;align-items:end;margin-bottom:9px}.item-row label{font-size:11px}.item-row input{padding:8px;min-width:0}
.pill{display:inline-block;border-radius:30px;padding:4px 10px;background:var(--cream);font-size:12px;color:#94400c;font-weight:700}.notice{background:#fff4de;border-radius:12px;padding:12px;color:#634919;margin:14px 0}.empty{padding:35px 15px;text-align:center;color:var(--muted)}
.monthpicker{max-width:190px}.right{text-align:right}.mini{padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:white}.rowReceipt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.rowReceipt:last-child{border:0}
.bar{height:9px;background:#f5e9df;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);border-radius:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252019;color:white;padding:11px 18px;border-radius:12px;display:none;z-index:40;max-width:90%;text-align:center}
@media(max-width:700px){.wrap,.grid2{grid-template-columns:1fr}.brand img{width:90px;height:72px}.brand h1{font-size:17px}.amount{font-size:34px}.item-row{grid-template-columns:minmax(100px,1fr) 54px 75px 75px 32px;gap:4px}.item-row input{font-size:12px;padding:6px}.item-row label{font-size:10px}.app{padding:12px 10px 70px}.panel{padding:14px}}
@media print{nav,.noprint{display:none!important}.app{max-width:none}.panel{break-inside:avoid}}

.pick-list{max-height:240px;overflow-y:auto;border:1px solid #eee3dc;border-radius:10px;padding:7px;margin:8px 0}
.pick-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 6px;border-bottom:1px solid #eee3dc}
.pick-row:last-child{border-bottom:0}
.pick-row input[type=checkbox]{width:20px;min-width:20px;min-height:20px;height:20px;margin:0;accent-color:#f46b16}
.pick-details{min-width:0;flex:1}
.pick-details .small{display:block;color:#766c66}
details.pick-panel{background:#fff8f1;border:1px solid #eee3dc;border-radius:12px;padding:12px;margin:13px 0}
details.pick-panel summary{cursor:pointer;font-weight:700}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body><main class="app"><header class="brand"><img crossorigin="anonymous" src="/brand.webp" alt="Logo oficial From Home Sandwiches & More"><div><h1>Control de Gastos</h1><p>FROM HOME SANDWICHES & MORE · Privado en este dispositivo</p></div></header>
<nav id="nav"><button class="navBtn active" data-view="home">Resumen</button><button class="navBtn" data-view="receipts">Facturas</button><button class="navBtn" data-view="reports">Informes</button><button class="navBtn" data-view="backup">Respaldo</button></nav>
<div id="page"></div><div id="toast"></div></main>
<script>
(function(){
"use strict";
var DB='fromHomeGastosV1',db=null,all=[],view='home',month=currentMonth(),editing=null,attachment=null,items=[],busy=false,saving=false,savedReports=loadReports(),activeReportId=null,pendingReportId=null,selectingReport=false;
var categories=['Ingredientes','Envases','Bebidas','Equipos','Limpieza','Transporte','Otros'];
var money=function(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)};
function currentMonth(){var a=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit'}).formatToParts(new Date());return a.find(function(x){return x.type==='year'}).value+'-'+a.find(function(x){return x.type==='month'}).value}
function today(){var a=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(function(k){return a.find(function(x){return x.type===k}).value}).join('-')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function num(v){return Math.max(0,Number(String(v==null?'':v).replace(',','.'))||0)}
function fmtDate(v){if(!v)return 'Sin fecha';var a=v.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v}
function monthLabel(m){var a=m.split('-');return new Intl.DateTimeFormat('es-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(Number(a[0]),Number(a[1])-1,1)))}
function toast(v){var e=document.getElementById('toast');e.textContent=v;e.style.display='block';setTimeout(function(){e.style.display='none'},3600)}
function fail(e){console.error(e);toast('Ocurrió un problema: '+(e&&e.message||e))}
function dbOpen(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore('receipts',{keyPath:'id'})};r.onsuccess=function(){db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
function op(kind,value){return new Promise(function(resolve,reject){var t=db.transaction('receipts',kind==='getAll'?'readonly':'readwrite'),store=t.objectStore('receipts'),request=kind==='getAll'?store.getAll():kind==='put'?store.put(value):store.delete(value),result;
request.onsuccess=function(){result=request.result};
t.oncomplete=function(){resolve(result)};
t.onerror=function(){reject(t.error||request.error||new Error('No se pudo guardar en el dispositivo'))};
t.onabort=function(){reject(t.error||new Error('La operación de guardado fue cancelada'))}
})}
async function refresh(){all=await op('getAll');all.sort(function(a,b){return (b.date+' '+b.time).localeCompare(a.date+' '+a.time)});render()}
function within(){return all.filter(function(r){return String(r.date||'').slice(0,7)===month})}

function loadReports(){try{var x=JSON.parse(localStorage.getItem('fromHomeCustomReportsV1')||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function persistReports(){try{localStorage.setItem('fromHomeCustomReportsV1',JSON.stringify(savedReports))}catch(e){toast('No se pudieron guardar los informes personalizados.')}} 
function selectedReport(){return savedReports.find(function(x){return x.id===activeReportId})||null}
function reportContext(){var saved=selectedReport(),first=month+'-01',last=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5,7)),0)).toISOString().slice(0,10);
return saved?{title:saved.title,from:saved.from,to:saved.to,rows:selectedReportRows(saved)}:{title:'Informe mensual de '+monthLabel(month),from:first,to:last,rows:within()}}

function selectedReportRows(r){
if(!r)return [];
if(Array.isArray(r.receiptIds)){var selection=new Set(r.receiptIds);return all.filter(function(x){return selection.has(x.id)})}
return all.filter(function(x){return x.date>=r.from&&x.date<=r.to})
}
function ensureReportSelection(r){if(!Array.isArray(r.receiptIds))r.receiptIds=selectedReportRows(r).map(function(x){return x.id})}
function attachToReport(id,invoiceId){
var r=savedReports.find(function(x){return x.id===id});
if(!r)return false;
ensureReportSelection(r);
if(r.receiptIds.indexOf(invoiceId)===-1)r.receiptIds.push(invoiceId);
persistReports();return true
}
function invoiceChoices(checkedIds,name){
var chosen=new Set(checkedIds||[]);
return all.length?'<div class="pick-list">'+all.map(function(r){return '<label class="pick-row"><input type="checkbox" class="'+name+'" value="'+esc(r.id)+'" '+(chosen.has(r.id)?'checked':'')+'><span class="pick-details"><strong>'+esc(r.store||'Lugar desconocido')+'</strong><span class="small">'+fmtDate(r.date)+' · '+esc(r.time||'Hora no registrada')+' · '+money(r.total)+'</span></span></label>'}).join('')+'</div>':'<div class="small muted">Todavía no hay facturas guardadas. Puedes crear una desde cero.</div>'
}
function focusReportContents(){var e=document.getElementById('reportContents');if(e&&e.scrollIntoView)e.scrollIntoView({block:'start',behavior:'smooth'})}
function checkedInvoices(cssClass){return Array.from(document.querySelectorAll('input.'+cssClass+':checked')).map(function(input){return input.value})}
function createSavedReport(){
var from=document.getElementById('reportFrom').value,to=document.getElementById('reportTo').value,title=document.getElementById('reportTitle').value.trim();
if(!from||!to||from>to){toast('Selecciona fechas válidas, con el día inicial antes del final.');return null}
if(!title)title='Gastos del '+fmtDate(from)+' al '+fmtDate(to);
var r={id:'i'+Date.now()+Math.random().toString(36).slice(2),title:title,from:from,to:to,receiptIds:checkedInvoices('new-report-invoice')};
savedReports.push(r);persistReports();activeReportId=r.id;selectingReport=false;return r
}

function weekendDates(){var x=new Date(today()+'T12:00:00Z'),day=x.getUTCDay(),off=day===6?-1:day===0?-2:(5-day+7)%7;x.setUTCDate(x.getUTCDate()+off);var from=x.toISOString().slice(0,10);x.setUTCDate(x.getUTCDate()+2);return {from:from,to:x.toISOString().slice(0,10)}}

function sum(arr){return arr.reduce(function(n,r){return n+num(r.total)},0)}
function setview(v){view=v;document.querySelectorAll('.navBtn').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});render()}
function actionbar(){return '<div class="flex between mt"><div><span class="eyebrow">Mes seleccionado</span><input class="monthpicker" id="month" aria-label="Mes seleccionado" type="month" value="'+esc(month)+'"></div><button class="btn" id="newReceipt">+ Nueva factura</button></div>'}
function render(){var p=document.getElementById('page');if(view==='edit'){p.innerHTML=editor();wireEditor();return} if(view==='home')p.innerHTML=home();else if(view==='receipts')p.innerHTML=receipts();else if(view==='reports')p.innerHTML=reports();else p.innerHTML=backupPage()}
function home(){
var rows=within(),spent=sum(rows);
return actionbar()+'<div class="wrap mt"><section class="panel metric"><div class="eyebrow">Total gastado · '+esc(monthLabel(month))+'</div><div class="amount">'+money(spent)+'</div><span class="pill">'+(month===currentMonth()?'Mes en curso':'Mes anterior')+'</span></section><section class="panel"><div class="eyebrow">Facturas registradas</div><div class="metricval">'+rows.length+'</div></section></div>'+
'<section class="panel mt"><h3>Compras recientes</h3>'+(rows.length?rows.slice(0,8).map(receiptRow).join(''):'<div class="empty">Aún no hay compras. Toca “Nueva factura” para registrar una.</div>')+'</section><p class="small muted">Al comenzar un nuevo mes el contador vuelve a cero. El historial de los otros meses se conserva.</p>'
}
function receiptRow(r){
return '<div class="rowReceipt"><div><strong>'+esc(r.store||'Lugar sin especificar')+'</strong><div class="muted small">'+fmtDate(r.date)+' · '+esc(r.time||'Hora no registrada')+'</div></div><div class="right"><strong>'+money(r.total)+'</strong><div><button class="mini" data-edit="'+esc(r.id)+'">Ver / editar</button></div></div></div>'
}
function receipts(){var r=within();return actionbar()+'<section class="panel mt"><div class="flex between"><h2>Facturas · '+esc(monthLabel(month))+'</h2><span class="pill">'+r.length+' compra(s)</span></div>'+(r.length?r.map(receiptRow).join(''):'<div class="empty">No hay facturas todavía. Usa “Nueva factura” para registrar tu primera compra.</div>')+'</section>'}
function reports(){
var ctx=reportContext(),rows=ctx.rows,tot=sum(rows),current=selectedReport();
return '<section class="panel mt"><h2>Crear informe personalizado</h2><p class="small muted">Pon un nombre, indica el período y selecciona las facturas que quieres incluir.</p>'+
'<div class="field"><label for="reportTitle">Nombre del informe</label><input id="reportTitle" placeholder="Ej. Gastos del fin de semana"></div>'+
'<div class="grid2"><div class="field"><label for="reportFrom">Desde</label><input id="reportFrom" type="date" value="'+today()+'"></div><div class="field"><label for="reportTo">Hasta</label><input id="reportTo" type="date" value="'+today()+'"></div></div>'+
'<div class="flex"><button class="mini" id="fillToday">Hoy</button><button class="mini" id="fillWeekend">Fin de semana</button><button class="mini" id="fillMonth">Mes</button></div>'+
'<details class="pick-panel"><summary>Seleccionar facturas existentes ('+all.length+')</summary><p class="small muted">Marca las que quieras añadir, aunque pertenezcan a otro mes. No se duplicarán los gastos.</p>'+invoiceChoices([],'new-report-invoice')+'</details>'+
'<div class="flex"><button class="btn" id="saveReport">Crear informe</button><button class="btn secondary" id="createReportAndReceipt">Crear informe + factura nueva</button></div>'+
'<h3 style="margin-top:20px">Informes guardados</h3>'+
(savedReports.length?savedReports.slice().reverse().map(function(x){var count=selectedReportRows(x).length;return '<div class="rowReceipt"><div><strong>'+esc(x.title)+'</strong><div class="small muted">'+fmtDate(x.from)+' al '+fmtDate(x.to)+' · '+count+' facturas</div></div><div class="flex"><button class="mini" data-report-open="'+esc(x.id)+'">Ver</button><button class="mini" data-report-remove="'+esc(x.id)+'">Eliminar</button></div></div>'}).join(''):'<p class="muted small">Sin informes personalizados todavía.</p>')+'</section>'+
'<section id="reportContents" class="panel mt"><div class="flex between"><div><h2>'+esc(ctx.title)+'</h2><div class="muted small">Período indicado: '+fmtDate(ctx.from)+' al '+fmtDate(ctx.to)+'</div></div>'+
(current?'<button class="mini" id="monthlyReport">Volver al mes</button>':'<input class="monthpicker" type="month" id="month" value="'+esc(month)+'">')+'</div>'+
'<div class="metricval mt">'+money(tot)+'</div><p class="small muted">'+rows.length+' facturas incluidas; el total se calcula solamente con las facturas del informe.</p>'+
(current?
'<div class="flex" style="margin-bottom:12px"><button class="btn" id="addNewToReport">+ Nueva factura para este informe</button><button class="btn secondary" id="chooseSavedForReport">Seleccionar facturas guardadas</button></div>'+
(selectingReport?'<div class="notice"><strong>Elegir facturas del informe</strong><p class="small">Marca las facturas que quieres incluir y desmarca las que deseas quitar. Las originales seguirán guardadas.</p>'+
invoiceChoices(rows.map(function(r){return r.id}),'manage-report-invoice')+
'<div class="flex"><button class="btn" id="saveInvoiceSelection">Guardar selección</button><button class="btn secondary" id="cancelInvoiceSelection">Cancelar</button></div></div>':'')
:'')+
'<div class="flex"><button id="pdf" class="btn">Descargar PDF</button><button id="csv" class="btn secondary">Descargar Excel (CSV)</button></div>'+
'<h3 style="margin-top:18px">Facturas de este informe</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Lugar</th><th class="money">Monto</th></tr></thead><tbody>'+
rows.map(function(r){return '<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.time||'—')+'</td><td>'+esc(r.store||'—')+'</td><td class="money">'+money(r.total)+'</td></tr>'}).join('')+'</tbody></table></div>'+
(!rows.length?'<p class="small muted">Este informe aún no contiene facturas. Utiliza uno de los dos botones de arriba para añadirlas.</p>':'')+'</section>'
}
function backupPage(){return '<div class="panel mt"><h2>Respaldo y privacidad</h2><p>Las facturas y sus archivos se guardan <strong>solo en este navegador y dispositivo</strong>, no en GitHub ni en una cuenta en la nube. Si borras los datos del navegador o cambias de teléfono, puedes perderlos.</p><div class="flex"><button id="backup" class="btn">Descargar respaldo completo (JSON)</button><label style="margin:0" class="btn secondary">Restaurar respaldo <input id="restore" type="file" accept=".json,application/json" style="display:none"></label></div><p class="small muted">Guarda el respaldo en un lugar seguro, porque puede contener datos de compras y las facturas originales.</p><p class="notice small">Esta primera versión usa almacenamiento local. No compartas el dispositivo con personas que no deban ver estos datos. El acceso con contraseña y la sincronización segura entre dispositivos requieren una siguiente fase.</p></div>'}
function editor(){
var r=editing||{store:'',date:today(),time:'',total:''};
return '<div class="mt"><button class="btn secondary" id="cancel">← Volver a facturas</button></div>'+
'<section class="panel mt"><h2>'+(editing&&editing.id?'Editar factura':'Subir factura')+'</h2>'+
'<p class="muted small">Selecciona una foto o PDF. El lector intentará completar los datos automáticamente. También puedes escribirlos a mano.</p>'+
'<div class="field" style="border:2px dashed #edbe9f;background:#fff8f1;padding:17px;border-radius:14px"><label for="file" style="font-size:16px">Seleccionar foto o PDF de factura</label><input type="file" accept="image/*,.pdf,application/pdf" id="file" style="border:0;padding:4px;max-width:100%"><div id="scanstatus" class="small muted" style="margin:8px 0">'+esc(attachment?'Archivo: '+attachment.name:editing&&editing.fileName?'Archivo guardado: '+editing.fileName:'Puedes usar el registro manual si no tienes foto.')+'</div><button type="button" class="btn secondary" id="scan">Volver a leer factura</button> '+(attachment||editing&&editing.fileBlob?'<button type="button" class="btn secondary" id="viewFile">Ver archivo</button>':'')+'</div>'+
'<div class="field"><label for="store">Lugar donde compraste</label><input id="store" placeholder="Ej. Restaurant Depot" value="'+esc(r.store||'')+'"></div>'+
'<div class="field"><label for="total">Cantidad gastada ($)</label><input id="total" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" value="'+(r.total?num(r.total):'')+'"></div>'+
'<div class="grid2"><div class="field"><label for="date">Día y mes de compra</label><input id="date" type="date" value="'+esc(r.date||today())+'"></div><div class="field"><label for="time">Hora de compra</label><input id="time" type="time" value="'+esc(r.time||'')+'"></div></div>'+
'<div class="flex"><button class="btn" type="button" id="save">Guardar factura</button>'+(editing&&editing.id?'<button class="btn danger" type="button" id="delete">Eliminar</button>':'')+'</div><p class="small muted">Verifica que los cuatro datos coincidan con la factura antes de guardarla.</p></section>'
}
function getForm(){
return {store:document.getElementById('store').value.trim(),date:document.getElementById('date').value,time:document.getElementById('time').value,total:num(document.getElementById('total').value)}
}
function wireEditor(){
var input=document.getElementById('file');
input.addEventListener('change',function(){attachment=input.files&&input.files[0]||null;if(attachment){document.getElementById('scanstatus').textContent='Factura seleccionada: '+attachment.name+' · Leyendo…';scan()}else scanStatus('Sin archivo seleccionado')})
}
async function prepareAttachment(blob){
if(!blob)return null;
if(blob.size<=1500000)return blob;
if(!/^image\//.test(blob.type))return blob.size<7000000?blob:null;
try{var bitmap=await createImageBitmap(blob),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);if(bitmap.close)bitmap.close();return await new Promise(function(resolve){c.toBlob(resolve,'image/jpeg',.78)})}catch(e){return blob.size<7000000?blob:null}
}
async function save(){
if(saving)return;var data=getForm();
if(!data.store){toast('Escribe el lugar donde compraste.');return}
if(!(data.total>0)){toast('Escribe la cantidad total gastada.');return}
if(!data.date){toast('Selecciona el día y mes de compra.');return}
saving=true;var button=document.getElementById('save');if(button){button.disabled=true;button.textContent='Guardando…'}
var original=attachment||editing&&editing.fileBlob,prepared=await prepareAttachment(original);
var record=Object.assign({},editing||{},{id:editing&&editing.id?editing.id:'r'+Date.now()+Math.random().toString(36).slice(2)},data,{fileBlob:prepared||null,fileName:original?(original.name||'Factura'):(editing&&editing.fileName||''),modifiedAt:new Date().toISOString()});
try{await op('put',record);var confirmed=await op('getAll');if(!confirmed.some(function(x){return x.id===record.id}))throw new Error('No se pudo confirmar el guardado');var assigned=pendingReportId&&attachToReport(pendingReportId,record.id);attachment=null;editing=null;pendingReportId=null;view=assigned?'reports':'receipts';month=record.date.slice(0,7);await refresh();if(assigned)focusReportContents();toast(assigned?'Factura guardada y añadida al informe.':(prepared||!original?'Factura guardada correctamente.':'Datos guardados. El archivo era demasiado grande para almacenarlo.'))}
catch(e){try{record.fileBlob=null;record.fileName='';await op('put',record);var a=await op('getAll');if(!a.some(function(x){return x.id===record.id}))throw new Error('No confirmado');var assigned=pendingReportId&&attachToReport(pendingReportId,record.id);attachment=null;editing=null;pendingReportId=null;view=assigned?'reports':'receipts';month=record.date.slice(0,7);await refresh();if(assigned)focusReportContents();toast(assigned?'Factura añadida al informe (sin guardar la foto).':'Datos guardados. No hubo espacio para conservar la imagen original.')}catch(err){console.error(e,err);toast('No se pudo guardar. Prueba desde Safari normal y verifica el espacio del dispositivo.')}}
finally{saving=false;var b=document.getElementById('save');if(b){b.disabled=false;b.textContent='Guardar factura'}}
}

function openEditor(r){editing=r||null;attachment=null;items=r?JSON.parse(JSON.stringify(r.items||[])):[];view='edit';render()}
function scanStatus(message){var e=document.getElementById('scanstatus');if(e)e.textContent=message}
function parseOCR(text){
var lines=String(text||'').split(/\r?\n/).map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean);
var out={store:'',date:'',time:'',total:null};
var names=lines.slice(0,10).filter(function(x){return /[a-zÀ-ÿ]{3}/i.test(x)&&x.length<90&&!/\b(receipt|invoice|factura|thank|welcome|gracias|date|fecha|phone|tel|time|hora|store #|tax id|total|subtotal)\b/i.test(x)&&!/\d{3,}/.test(x)});
out.store=(names[0]||'').slice(0,80);
var d=text.match(/\b(20\d\d)[\/-](0?[1-9]|1[0-2])[\/-](0?[1-9]|[12]\d|3[01])\b/);
if(d)out.date=d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');
else{d=text.match(/\b(0?[1-9]|1[0-2])[\/-](0?[1-9]|[12]\d|3[01])[\/-](20\d\d|\d\d)\b/);if(d)out.date=(d[3].length===2?'20'+d[3]:d[3])+'-'+d[1].padStart(2,'0')+'-'+d[2].padStart(2,'0')}
var h=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)(?:\:\d\d)?\s*(AM|PM)?\b/i);
if(h){var hr=Number(h[1]);if(h[3])hr=hr%12+(/pm/i.test(h[3])?12:0);out.time=String(hr).padStart(2,'0')+':'+h[2]}
var amounts=[];
lines.forEach(function(line,i){if(/\b(subtotal|sub total|sub-total|total tax|total items|total savings|total discounts)\b/i.test(line))return;
var matches=[],re=/\$?\s*(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2}|\d+,\d{2})(?!\d)/g,m;
while((m=re.exec(line))){var raw=m[1],value=Number(/^\d+,\d{2}$/.test(raw)?raw.replace(',','.'):raw.replace(/,/g,''));if(Number.isFinite(value))matches.push(value)}
if(matches.length&&/\b(grand total|total due|amount due|balance due|total amount|total paid|total\b|importe total|monto total)\b/i.test(line)){amounts.push({v:matches[matches.length-1],rank:/grand total|total due|amount due|balance due/i.test(line)?2:1,i:i})}});
amounts.sort(function(a,b){return b.rank-a.rank||b.i-a.i});if(amounts.length)out.total=amounts[0].v;
return out
}
function applyOCR(raw){
var data=getForm(),parsed=parseOCR(raw);
if(parsed.store)data.store=parsed.store;if(parsed.date)data.date=parsed.date;if(parsed.time)data.time=parsed.time;if(parsed.total!==null)data.total=parsed.total;
editing=Object.assign({},editing||{},data);render();scanStatus('Lectura finalizada. Verifica el lugar, la cantidad, el día y la hora.');toast('Lectura terminada. Corrige cualquier dato antes de guardar.')
}

async function scan(){
if(busy)return;var file=attachment||editing&&editing.fileBlob;if(!file){toast('Primero selecciona una imagen o PDF.');return}
busy=true;var button=document.getElementById('scan');if(button)button.disabled=true;
try{scanStatus('Leyendo archivo…');var source=file,raw='';
if((file.type||'').includes('pdf')||/\.pdf$/i.test(file.name||'')){
if(!window.pdfjsLib)throw new Error('No se pudo cargar el lector de PDF');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,parts=[];
for(var n=1;n<=Math.min(pdf.numPages,3);n++){var pg=await pdf.getPage(n),ct=await pg.getTextContent(),rows={};ct.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3)*3;(rows[y]||(rows[y]=[])).push({x:it.transform[4],s:it.str})});parts.push(Object.keys(rows).map(Number).sort(function(a,b){return b-a}).map(function(y){return rows[y].sort(function(a,b){return a.x-b.x}).map(function(x){return x.s}).join(' ')}).join('\n'))}
raw=parts.join('\n');
if(raw.replace(/\s/g,'').length<50){raw='';var page=await pdf.getPage(1),v=page.getViewport({scale:2.1}),canvas=document.createElement('canvas');canvas.width=v.width;canvas.height=v.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise;source=canvas}
if(pdf.numPages>3)toast('Se procesaron solo las tres primeras páginas; revisa el resto.')}
if(!raw){
if(!window.Tesseract)throw new Error('No se pudo cargar el lector de fotografías');
var result;try{result=await Tesseract.recognize(source,'eng+spa',{logger:function(x){if(x.status==='recognizing text')scanStatus('Leyendo texto… '+Math.round((x.progress||0)*100)+'%')}})}catch(e){scanStatus('Probando lectura alternativa…');result=await Tesseract.recognize(source,'eng')}
raw=result.data.text||''}
if(!raw.trim())throw new Error('El archivo no contiene texto reconocible');
applyOCR(raw)
}catch(e){fail(e);scanStatus('No se pudo leer. Puedes registrar la factura manualmente.')}
finally{busy=false;var b=document.getElementById('scan');if(b)b.disabled=false}
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function download(blob,name){var a=document.createElement('a');var url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000)}
function exportCsv(){
var ctx=reportContext(),rows=[['Informe',ctx.title],['Desde',ctx.from],['Hasta',ctx.to],['Monto total',sum(ctx.rows).toFixed(2)],[],['Fecha','Hora','Lugar de compra','Cantidad gastada']];
ctx.rows.forEach(function(r){rows.push([r.date,r.time,r.store,num(r.total).toFixed(2)])});
download(new Blob(['\ufeff'+rows.map(function(row){return row.map(csvCell).join(',')}).join('\r\n')],{type:'text/csv;charset=utf-8'}),'From_Home_Gastos_'+ctx.from+'_a_'+ctx.to+'.csv');toast('Informe descargado')
}

async function exportPdf(){
if(!window.jspdf){toast('El generador PDF no cargó. Puedes descargar Excel (CSV) o volver a intentar con internet.');return}
try{
var ctx=reportContext(),doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),y=18;
doc.setFontSize(16);doc.text('FROM HOME | CONTROL DE GASTOS',14,y);y+=11;
doc.setFontSize(11);doc.text(String(ctx.title).slice(0,90),14,y);y+=8;
doc.text('Del '+fmtDate(ctx.from)+' al '+fmtDate(ctx.to),14,y);y+=8;
doc.text('Monto total: '+money(sum(ctx.rows))+'  |  Facturas: '+ctx.rows.length,14,y);y+=12;
ctx.rows.forEach(function(r){if(y>278){doc.addPage();y=20}var line=fmtDate(r.date)+'   '+(r.time||'—')+'   '+(r.store||'—')+'   '+money(r.total),wrapped=doc.splitTextToSize(line,180);doc.setFontSize(10);doc.text(wrapped,14,y);y+=6*wrapped.length+2});
if(!ctx.rows.length)doc.text('No se registraron gastos en este periodo.',14,y);
doc.save('From_Home_Informe_'+ctx.from+'_a_'+ctx.to+'.pdf');toast('Informe PDF descargado')
}catch(e){console.error(e);toast('No se pudo crear el PDF. Intenta el informe Excel (CSV).')}
}

async function backup(){try{var z=[];for(var r of all){var v=Object.assign({},r);if(v.fileBlob){var b=v.fileBlob;v.fileBase64=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=function(){reject(reader.error)};reader.readAsDataURL(b)});delete v.fileBlob}z.push(v)}download(new Blob([JSON.stringify({app:'From Home Control de Gastos',version:1,receipts:z,reports:savedReports})],{type:'application/json'}),'From_Home_Respaldo_'+today()+'.json');toast('Respaldo descargado')}catch(e){fail(e)}}
async function restore(file){if(!file)return;if(!confirm('¿Restaurar este respaldo? Los registros con el mismo identificador serán reemplazados.'))return;try{var data=JSON.parse(await file.text());if(!data||!Array.isArray(data.receipts)||data.version!==1)throw new Error('Formato de respaldo no válido');for(var r of data.receipts){if(!r.id||!r.date||!r.store||!Number.isFinite(Number(r.total)))continue;if(r.fileBase64){var resp=await fetch(r.fileBase64);r.fileBlob=await resp.blob();delete r.fileBase64}await op('put',r)}if(Array.isArray(data.reports)){savedReports=data.reports.filter(function(x){return x&&x.id&&x.from&&x.to&&x.title});persistReports()}await refresh();toast('Respaldo restaurado')}catch(e){fail(e)}}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b)setview(b.dataset.view)});
document.getElementById('page').addEventListener('change',function(e){if(e.target.id==='month'){month=e.target.value;activeReportId=null;render()}else if(e.target.id==='restore')restore(e.target.files[0])});
document.getElementById('page').addEventListener('click',async function(e){var t=e.target,b=t.closest('button'),id=b&&b.id;if(!b)return;
if(id==='saveReport'||id==='createReportAndReceipt'){var created=createSavedReport();if(!created)return;if(id==='createReportAndReceipt'){pendingReportId=created.id;openEditor(null);toast('Informe creado. Completa la nueva factura.')}else{render();focusReportContents();toast('Informe creado. Puedes añadir más facturas desde aquí.')}}
else if(id==='fillToday'){document.getElementById('reportFrom').value=today();document.getElementById('reportTo').value=today();document.getElementById('reportTitle').value='Gastos de hoy'}
else if(id==='fillWeekend'){var dates=weekendDates();document.getElementById('reportFrom').value=dates.from;document.getElementById('reportTo').value=dates.to;document.getElementById('reportTitle').value='Gastos del fin de semana'}
else if(id==='fillMonth'){var c=reportContext();document.getElementById('reportFrom').value=month+'-01';document.getElementById('reportTo').value=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5,7)),0)).toISOString().slice(0,10);document.getElementById('reportTitle').value='Gastos de '+monthLabel(month)}
else if(b.dataset.reportOpen){activeReportId=b.dataset.reportOpen;selectingReport=false;render();focusReportContents()}
else if(id==='chooseSavedForReport'){selectingReport=true;render()}
else if(id==='cancelInvoiceSelection'){selectingReport=false;render()}
else if(id==='saveInvoiceSelection'){var report=selectedReport();if(report){report.receiptIds=checkedInvoices('manage-report-invoice');persistReports();selectingReport=false;render();toast('Selección guardada; el informe se actualizó.')}}
else if(id==='addNewToReport'){pendingReportId=activeReportId;openEditor(null)}
else if(b.dataset.reportRemove){if(confirm('¿Eliminar este informe guardado? Las facturas originales no se borrarán.')){savedReports=savedReports.filter(function(x){return x.id!==b.dataset.reportRemove});if(activeReportId===b.dataset.reportRemove){activeReportId=null;selectingReport=false}persistReports();render();toast('Informe eliminado; las facturas siguen guardadas.')}}
else if(id==='monthlyReport'){activeReportId=null;selectingReport=false;render()}
else if(id==='newReceipt'){pendingReportId=null;openEditor(null)}
else if(b.dataset.edit){pendingReportId=null;openEditor(all.find(function(r){return r.id===b.dataset.edit}))}
else if(id==='cancel'){attachment=null;editing=null;var fromReport=!!pendingReportId;pendingReportId=null;setview(fromReport?'reports':'receipts');if(fromReport)focusReportContents()}
else if(id==='save'){await save()}
else if(id==='scan'){await scan()}
else if(id==='viewFile'){var f=attachment||editing&&editing.fileBlob;if(f){var u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(function(){URL.revokeObjectURL(u)},60000)}}
else if(id==='delete'&&editing&&confirm('¿Eliminar esta factura definitivamente?')){await op('delete',editing.id);attachment=null;editing=null;view='receipts';await refresh();toast('Factura eliminada')}
else if(id==='csv'){exportCsv()}else if(id==='pdf'){await exportPdf()}else if(id==='backup'){await backup()}});
render();dbOpen().then(refresh).catch(function(e){console.error(e);toast('Almacenamiento no disponible en este navegador. Abre desde Safari normal, no en navegación privada.');});
})();
</script></body></html>
