<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Home · Control de Gastos</title><meta name="theme-color" content="#f46b16">
<style>
:root{--ink:#251b15;--muted:#766c66;--line:#eee3dc;--orange:#f46b16;--cream:#fff7f1;--bg:#fffaf7;--white:#fff;--green:#197657}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--orange)}.app{max-width:980px;margin:auto;padding:20px 16px 80px}
.brand{display:flex;align-items:center;gap:15px;background:white;border:1px solid var(--line);border-radius:22px;padding:10px 16px;box-shadow:0 5px 25px #6e36100b}
.brand img{width:102px;height:83px;object-fit:contain}.brand h1{font-size:20px;margin:0;line-height:1.2}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.navBtn{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 15px;font-weight:650;color:var(--ink)}.navBtn.active{background:var(--ink);color:#fff}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:19px;padding:20px;background:white;box-shadow:0 3px 14px #6e361007}
.metric{background:var(--cream);border:1px solid #ffe4d3}.eyebrow{font-size:12px;color:var(--muted);font-weight:650}.amount{font-size:38px;font-weight:800;letter-spacing:-1.5px}.metricval{font-size:26px;font-weight:750}
h2{font-size:21px;margin:2px 0 15px}h3{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.mt{margin-top:18px}
.btn{background:var(--orange);color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.btn.secondary{background:white;border:1px solid #e4cbbd;color:var(--ink)}.btn.danger{background:#fff0ef;color:#a52623}.btn:disabled{opacity:.6;cursor:not-allowed}
.tablewrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:middle}th{font-size:12px;color:var(--muted)}td.money,th.money{text-align:right;white-space:nowrap}
label{font-size:12px;font-weight:700;color:#4d4038;display:block;margin-bottom:5px}input,select,textarea{display:block;width:100%;background:#fff;border:1px solid #ded4cd;border-radius:10px;padding:11px;color:var(--ink);min-height:43px}input:focus,select:focus{outline:2px solid #f9b585}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.item-row{display:grid;grid-template-columns:minmax(140px,2fr) 70px 95px 95px 40px;gap:8px;align-items:end;margin-bottom:9px}.item-row label{font-size:11px}.item-row input{padding:8px;min-width:0}
.pill{display:inline-block;border-radius:30px;padding:4px 10px;background:var(--cream);font-size:12px;color:#94400c;font-weight:700}.notice{background:#fff4de;border-radius:12px;padding:12px;color:#634919;margin:14px 0}.empty{padding:35px 15px;text-align:center;color:var(--muted)}
.monthpicker{max-width:190px}.right{text-align:right}.mini{padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:white}.rowReceipt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.rowReceipt:last-child{border:0}
.bar{height:9px;background:#f5e9df;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);border-radius:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252019;color:white;padding:11px 18px;border-radius:12px;display:none;z-index:40;max-width:90%;text-align:center}
@media(max-width:700px){.wrap,.grid2{grid-template-columns:1fr}.brand img{width:90px;height:72px}.brand h1{font-size:17px}.amount{font-size:34px}.item-row{grid-template-columns:minmax(100px,1fr) 54px 75px 75px 32px;gap:4px}.item-row input{font-size:12px;padding:6px}.item-row label{font-size:10px}.app{padding:12px 10px 70px}.panel{padding:14px}}
@media print{nav,.noprint{display:none!important}.app{max-width:none}.panel{break-inside:avoid}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body><main class="app"><header class="brand"><img crossorigin="anonymous" src="/brand.webp" alt="Logo oficial From Home Sandwiches & More"><div><h1>Control de Gastos</h1><p>FROM HOME SANDWICHES & MORE · Privado en este dispositivo</p></div></header>
<nav id="nav"><button class="navBtn active" data-view="home">Resumen</button><button class="navBtn" data-view="receipts">Facturas</button><button class="navBtn" data-view="reports">Informes</button><button class="navBtn" data-view="backup">Respaldo</button></nav>
<div id="page"></div><div id="toast"></div></main>
<script>
(function(){
"use strict";
var DB='fromHomeGastosV1',db=null,all=[],view='home',month=currentMonth(),editing=null,attachment=null,items=[],busy=false,savedReports=loadReports(),activeReportId=null;
var categories=['Ingredientes','Envases','Bebidas','Equipos','Limpieza','Transporte','Otros'];
var money=function(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)};
function currentMonth(){var a=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit'}).formatToParts(new Date());return a.find(function(x){return x.type==='year'}).value+'-'+a.find(function(x){return x.type==='month'}).value}
function today(){var a=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(function(k){return a.find(function(x){return x.type===k}).value}).join('-')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function num(v){return Math.max(0,Number(String(v==null?'':v).replace(',','.'))||0)}
function fmtDate(v){if(!v)return 'Sin fecha';var a=v.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v}
function monthLabel(m){var a=m.split('-');return new Intl.DateTimeFormat('es-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(Number(a[0]),Number(a[1])-1,1)))}
function toast(v){var e=document.getElementById('toast');e.textContent=v;e.style.display='block';setTimeout(function(){e.style.display='none'},3600)}
function fail(e){console.error(e);toast('Ocurrió un problema: '+(e&&e.message||e))}
function dbOpen(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore('receipts',{keyPath:'id'})};r.onsuccess=function(){db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
function op(kind,value){return new Promise(function(resolve,reject){var t=db.transaction('receipts',kind==='getAll'?'readonly':'readwrite'),store=t.objectStore('receipts'),request=kind==='getAll'?store.getAll():kind==='put'?store.put(value):store.delete(value),result;
request.onsuccess=function(){result=request.result};
t.oncomplete=function(){resolve(result)};
t.onerror=function(){reject(t.error||request.error||new Error('No se pudo guardar en el dispositivo'))};
t.onabort=function(){reject(t.error||new Error('La operación de guardado fue cancelada'))}
})}
async function refresh(){all=await op('getAll');all.sort(function(a,b){return (b.date+' '+b.time).localeCompare(a.date+' '+a.time)});render()}
function within(){return all.filter(function(r){return String(r.date||'').slice(0,7)===month})}

function loadReports(){try{var x=JSON.parse(localStorage.getItem('fromHomeCustomReportsV1')||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function persistReports(){try{localStorage.setItem('fromHomeCustomReportsV1',JSON.stringify(savedReports))}catch(e){toast('No se pudieron guardar los informes personalizados.')}} 
function selectedReport(){return savedReports.find(function(x){return x.id===activeReportId})||null}
function reportContext(){var saved=selectedReport(),first=month+'-01',last=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5,7)),0)).toISOString().slice(0,10);
return saved?{title:saved.title,from:saved.from,to:saved.to,rows:all.filter(function(x){return x.date>=saved.from&&x.date<=saved.to})}:{title:'Informe mensual de '+monthLabel(month),from:first,to:last,rows:within()}}
function weekendDates(){var x=new Date(today()+'T12:00:00Z'),day=x.getUTCDay(),off=day===6?-1:day===0?-2:(5-day+7)%7;x.setUTCDate(x.getUTCDate()+off);var from=x.toISOString().slice(0,10);x.setUTCDate(x.getUTCDate()+2);return {from:from,to:x.toISOString().slice(0,10)}}

function sum(arr){return arr.reduce(function(n,r){return n+num(r.total)},0)}
function setview(v){view=v;document.querySelectorAll('.navBtn').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});render()}
function actionbar(){return '<div class="flex between mt"><div><span class="eyebrow">Mes seleccionado</span><input class="monthpicker" id="month" aria-label="Mes seleccionado" type="month" value="'+esc(month)+'"></div><button class="btn" id="newReceipt">+ Nueva factura</button></div>'}
function render(){var p=document.getElementById('page');if(view==='edit'){p.innerHTML=editor();wireEditor();return} if(view==='home')p.innerHTML=home();else if(view==='receipts')p.innerHTML=receipts();else if(view==='reports')p.innerHTML=reports();else p.innerHTML=backupPage()}
function home(){var r=within(),s=sum(r);var cat={};r.forEach(function(x){cat[x.category||'Otros']=(cat[x.category||'Otros']||0)+num(x.total)});var entries=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]});
return actionbar()+'<div class="wrap mt"><section class="panel metric"><div class="eyebrow">Total gastado · '+esc(monthLabel(month))+'</div><div class="amount">'+money(s)+'</div><span class="pill">'+(month===currentMonth()?'Mes en curso':'Mes del historial')+'</span></section><section class="panel"><div class="eyebrow">Compras registradas</div><div class="metricval">'+r.length+'</div><div class="muted small">Gasto promedio: '+money(r.length?s/r.length:0)+'</div></section></div><div class="wrap mt"><section class="panel"><h3>Últimas facturas</h3>'+ (r.length?r.slice(0,6).map(receiptRow).join(''):'<div class="empty">Todavía no hay compras registradas para este mes.</div>')+'</section><section class="panel"><h3>Gastos por categoría</h3>'+(entries.length?entries.map(function(k){return '<div style="margin:0 0 16px"><div class="flex between small"><b>'+esc(k)+'</b><span>'+money(cat[k])+'</span></div><div class="bar"><span style="width:'+Math.round(cat[k]/Math.max(s,.01)*100)+'%"></span></div></div>'}).join(''):'<div class="empty">Aquí verás en qué gastas más.</div>')+'</section></div><p class="small muted">Cada mes comienza en cero automáticamente. Los datos de meses anteriores se conservan.</p>'}
function receiptRow(r){return '<div class="rowReceipt"><div><strong>'+esc(r.store)+'</strong><div class="muted small">'+fmtDate(r.date)+(r.time?' · '+esc(r.time):'')+' · '+esc(r.category||'Otros')+'</div></div><div class="right"><strong>'+money(r.total)+'</strong><div><button class="mini" data-edit="'+esc(r.id)+'">Ver / editar</button></div></div></div>'}
function receipts(){var r=within();return actionbar()+'<section class="panel mt"><div class="flex between"><h2>Facturas · '+esc(monthLabel(month))+'</h2><span class="pill">'+r.length+' compra(s)</span></div>'+(r.length?r.map(receiptRow).join(''):'<div class="empty">No hay facturas todavía. Usa “Nueva factura” para registrar tu primera compra.</div>')+'</section>'}
function reports(){
var ctx=reportContext(),r=ctx.rows,cat={},store={};r.forEach(function(x){cat[x.category||'Otros']=(cat[x.category||'Otros']||0)+num(x.total);store[x.store]=(store[x.store]||0)+num(x.total)});
return '<section class="panel mt"><div class="flex between"><h2>Crear informe personalizado</h2><span class="pill">Por fechas</span></div>'+
'<p class="small muted">Elige el nombre y las fechas exactas que quieres incluir. Podrás guardar y descargar el informe cuantas veces necesites.</p>'+
'<div class="field"><label>Nombre del informe</label><input id="reportTitle" maxlength="100" placeholder="Ej. Gastos del fin de semana"></div>'+
'<div class="grid2"><div class="field"><label>Desde (incluido)</label><input id="reportFrom" type="date" value="'+today()+'"></div><div class="field"><label>Hasta (incluido)</label><input id="reportTo" type="date" value="'+today()+'"></div></div>'+
'<div class="flex" style="margin-bottom:14px"><button class="mini" id="fillToday">Hoy</button><button class="mini" id="fillWeekend">Este fin de semana (vie–dom)</button><button class="mini" id="fillMonth">Mes seleccionado</button></div>'+
'<button class="btn" id="saveReport">+ Crear y guardar informe</button>'+
'<div class="mt"><h3>Informes guardados</h3>'+(savedReports.length?savedReports.slice().reverse().map(function(x){return '<div class="rowReceipt"><div><b>'+esc(x.title)+'</b><div class="small muted">Del '+fmtDate(x.from)+' al '+fmtDate(x.to)+'</div></div><div class="flex"><button class="mini" data-report-open="'+esc(x.id)+'">Ver</button><button class="mini" data-report-remove="'+esc(x.id)+'">Eliminar</button></div></div>'}).join(''):'<p class="muted small">Todavía no hay informes personalizados guardados.</p>')+'</div></section>'+
'<section class="panel mt"><div class="flex between"><div><h2>'+esc(ctx.title)+'</h2><p class="muted small">Período del '+fmtDate(ctx.from)+' al '+fmtDate(ctx.to)+' (ambas fechas incluidas)</p></div>'+(selectedReport()?'<button class="mini" id="monthlyReport">Volver al mensual</button>':'<div><label>Informe mensual</label><input id="month" type="month" class="monthpicker" value="'+esc(month)+'"></div>')+'</div>'+
'<div class="flex"><button id="pdf" class="btn">Descargar PDF</button><button id="csv" class="btn secondary">Descargar Excel (CSV)</button></div>'+
'<div class="metricval mt">'+money(sum(r))+'</div><p class="muted small">'+r.length+' compra(s) en este período</p>'+
'<div class="grid2"><div><h3>Por comercio</h3>'+(Object.keys(store).length?Object.keys(store).sort().map(function(k){return '<div class="rowReceipt">'+esc(k)+' <b>'+money(store[k])+'</b></div>'}).join(''):'<p class="muted">Sin compras</p>')+'</div><div><h3>Por categoría</h3>'+(Object.keys(cat).length?Object.keys(cat).sort().map(function(k){return '<div class="rowReceipt">'+esc(k)+' <b>'+money(cat[k])+'</b></div>'}).join(''):'<p class="muted">Sin compras</p>')+'</div></div>'+
'<h3 style="margin-top:20px">Detalle de compras</h3><div class="tablewrap"><table><thead><tr><th>Día</th><th>Hora</th><th>Comercio</th><th>Producto(s)</th><th class="money">Total</th></tr></thead><tbody>'+r.map(function(x){return '<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.time||'—')+'</td><td>'+esc(x.store)+'</td><td>'+esc((x.items||[]).map(function(i){return i.name+' ×'+i.qty}).join(', ')||'—')+'</td><td class="money">'+money(x.total)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function backupPage(){return '<div class="panel mt"><h2>Respaldo y privacidad</h2><p>Las facturas y sus archivos se guardan <strong>solo en este navegador y dispositivo</strong>, no en GitHub ni en una cuenta en la nube. Si borras los datos del navegador o cambias de teléfono, puedes perderlos.</p><div class="flex"><button id="backup" class="btn">Descargar respaldo completo (JSON)</button><label style="margin:0" class="btn secondary">Restaurar respaldo <input id="restore" type="file" accept=".json,application/json" style="display:none"></label></div><p class="small muted">Guarda el respaldo en un lugar seguro, porque puede contener datos de compras y las facturas originales.</p><p class="notice small">Esta primera versión usa almacenamiento local. No compartas el dispositivo con personas que no deban ver estos datos. El acceso con contraseña y la sincronización segura entre dispositivos requieren una siguiente fase.</p></div>'}
function editor(){var r=editing||{store:'',date:today(),time:'',category:'Ingredientes',tax:0,discount:0,total:0,note:''};
var subtotal=items.reduce(function(s,i){return s+num(i.qty)*num(i.price)},0),calc=subtotal+num(r.tax)-num(r.discount);
return '<div class="flex between mt"><button class="btn secondary" id="cancel">← Volver</button><span class="pill">'+(editing&&editing.id?'Editar compra':'Nueva compra')+'</span></div><section class="panel mt"><h2>Factura y productos</h2><p class="small muted">Sube una foto o PDF para intentar leer sus datos automáticamente. Revisa lo reconocido antes de guardar; también puedes escribir o corregir todo manualmente.</p><div class="field"><label for="file">Factura original (imagen o PDF)</label><input type="file" accept="image/*,.pdf,application/pdf" id="file"><div id="scanstatus" class="small muted" style="margin:6px 0">'+(attachment?'Archivo adjunto: '+esc(attachment.name):editing&&editing.fileName?'Archivo guardado: '+esc(editing.fileName):'Sin archivo')+'</div><button class="mini" id="scan" type="button">Leer automáticamente la factura</button> '+(editing&&editing.fileBlob?'<button class="mini" id="viewFile">Ver original</button>':'')+'</div>'+(r.ocrText?'<details class="notice" open><summary><b>Texto reconocido de la factura</b> (puedes corregirlo)</summary><p class="small">'+(r.ocrWarnings&&r.ocrWarnings.length?r.ocrWarnings.map(esc).join(' ')+' ':'')+'Verifica nombre, cantidades, precios y total antes de guardar.</p><textarea id="ocrText" rows="7">'+esc(r.ocrText)+'</textarea><button class="mini" id="reparse" type="button">Analizar texto corregido</button></details>':'')+'<div class="grid2"><div class="field"><label>Comercio</label><input id="store" required placeholder="Ej. Restaurant Depot" value="'+esc(r.store)+'"></div><div class="field"><label>Categoría</label><select id="category">'+categories.map(function(c){return '<option '+(c===r.category?'selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div class="field"><label>Fecha de compra</label><input type="date" id="date" value="'+esc(r.date)+'"></div><div class="field"><label>Hora de compra (si aparece)</label><input type="time" id="time" value="'+esc(r.time||'')+'"></div></div><h3>Productos</h3><div class="item-row small muted"><span>Nombre</span><span>Cant.</span><span>Precio</span><span>Subtotal</span><span></span></div><div id="itemRows">'+items.map(itemRow).join('')+'</div><button class="btn secondary" id="addItem" type="button">+ Agregar producto</button><div class="grid2 mt"><div class="field"><label>Impuestos ($)</label><input id="tax" inputmode="decimal" type="number" min="0" step=".01" value="'+num(r.tax)+'"></div><div class="field"><label>Descuentos ($)</label><input id="discount" inputmode="decimal" type="number" min="0" step=".01" value="'+num(r.discount)+'"></div><div class="field"><label>Total de la factura ($)</label><input id="total" inputmode="decimal" type="number" min="0" step=".01" value="'+num(r.total)+'"></div><div class="field"><label>Subtotal calculado de productos</label><div class="metricval" id="subtotal">'+money(subtotal)+'</div><div class="small muted" id="check">'+(Math.abs(calc-num(r.total))<0.02?'✓ Totales coinciden':'Verifica el total, impuestos y productos')+'</div></div></div><div class="field"><label>Notas</label><textarea id="note" rows="2" placeholder="Observaciones opcionales">'+esc(r.note||'')+'</textarea></div><div class="flex"><button class="btn" id="save">Guardar factura</button>'+(editing&&editing.id?'<button class="btn danger" id="delete">Eliminar</button>':'')+'</div></section>'}
function itemRow(x,i){return '<div class="item-row" data-i="'+i+'"><input aria-label="Producto" placeholder="Producto" class="itName" value="'+esc(x.name||'')+'"><input aria-label="Cantidad" class="itQty" type="number" min=".01" step=".01" value="'+num(x.qty||1)+'"><input aria-label="Precio unitario" class="itPrice" type="number" min="0" step=".01" value="'+num(x.price)+'"><input aria-label="Subtotal" value="'+money(num(x.qty)*num(x.price))+'" readonly><button class="mini" aria-label="Quitar producto" data-remove="'+i+'">×</button></div>'}
function syncItems(){items=Array.from(document.querySelectorAll('#itemRows .item-row')).map(function(e){return {name:e.querySelector('.itName').value.trim(),qty:num(e.querySelector('.itQty').value)||1,price:num(e.querySelector('.itPrice').value)}})}
function getForm(){return {store:document.getElementById('store').value.trim(),category:document.getElementById('category').value,date:document.getElementById('date').value,time:document.getElementById('time').value,tax:num(document.getElementById('tax').value),discount:num(document.getElementById('discount').value),total:num(document.getElementById('total').value),note:document.getElementById('note').value.trim()}}
function wireEditor(){var file=document.getElementById('file');file.addEventListener('change',function(){attachment=file.files[0]||null;document.getElementById('scanstatus').textContent=attachment?'Archivo seleccionado: '+attachment.name:'Sin archivo'});
document.getElementById('itemRows').addEventListener('input',function(){var rows=Array.from(document.querySelectorAll('.item-row'));var s=0;rows.forEach(function(e){var n=num(e.querySelector('.itQty').value)*num(e.querySelector('.itPrice').value);s+=n;e.querySelector('input[readonly]').value=money(n)});document.getElementById('subtotal').textContent=money(s);reconcile(s)});
['tax','discount','total'].forEach(function(k){document.getElementById(k).addEventListener('input',function(){var s=Array.from(document.querySelectorAll('.item-row')).reduce(function(n,e){return n+num(e.querySelector('.itQty').value)*num(e.querySelector('.itPrice').value)},0);reconcile(s)})})}
function reconcile(s){var calc=s+num(document.getElementById('tax').value)-num(document.getElementById('discount').value),given=num(document.getElementById('total').value);document.getElementById('check').textContent=Math.abs(calc-given)<.02?'✓ Totales coinciden':'Diferencia por revisar: '+money(given-calc)}
async function save(){syncItems();var v=getForm();if(!v.store||!v.date){toast('Escribe comercio y fecha de compra.');return}if(!v.total&&items.length){v.total=Math.round((items.reduce(function(s,i){return s+i.qty*i.price},0)+v.tax-v.discount)*100)/100}
var r=Object.assign({},editing||{},{id:editing&&editing.id?editing.id:'r'+Date.now()+Math.random().toString(36).slice(2)},v,{items:items.filter(function(x){return x.name}),fileBlob:attachment||editing&&editing.fileBlob||null,fileName:attachment?attachment.name:editing&&editing.fileName||'',modifiedAt:new Date().toISOString()});
try{await op('put',r);var confirmed=await op('getAll');if(!confirmed.some(function(x){return x.id===r.id}))throw new Error('No se pudo confirmar que la factura quedó guardada');attachment=null;editing=null;view='receipts';month=r.date.slice(0,7);await refresh();toast('Factura guardada y verificada')}catch(e){fail(e);toast('La factura NO se guardó. Revisa el espacio del dispositivo y vuelve a intentarlo. No cierres esta página todavía.')}}
function openEditor(r){editing=r||null;attachment=null;items=r?JSON.parse(JSON.stringify(r.items||[])):[];view='edit';render()}
function scanStatus(message){var e=document.getElementById('scanstatus');if(e)e.textContent=message}
function parseOCR(text){
var lines=String(text||'').split(/\r?\n/).map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean),out={store:'',date:'',time:'',total:null,tax:0,discount:0,items:[],warnings:[]};
if(!lines.length)return out;
var names=lines.slice(0,9).filter(function(x){return /[a-zÀ-ÿ]{3}/i.test(x)&&x.length<85&&!/\b(receipt|invoice|factura|thank|welcome|gracias|date|fecha|phone|tel|time|hora|register|store #|tax id|total)\b/i.test(x)&&!/\d{3,}/.test(x)});
out.store=(names[0]||'').slice(0,75);
var d=text.match(/\b(20\d\d)[\/-](0?[1-9]|1[0-2])[\/-](0?[1-9]|[12]\d|3[01])\b/);
if(d)out.date=d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');
else{d=text.match(/\b(0?[1-9]|1[0-2])[\/-](0?[1-9]|[12]\d|3[01])[\/-](20\d\d|\d\d)\b/);if(d)out.date=(d[3].length===2?'20'+d[3]:d[3])+'-'+d[1].padStart(2,'0')+'-'+d[2].padStart(2,'0')}
var hm=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)(?:\:\d\d)?\s*(AM|PM)?\b/i);
if(hm){var hour=Number(hm[1]);if(hm[3])hour=hour%12+(/PM/i.test(hm[3])?12:0);out.time=String(hour).padStart(2,'0')+':'+hm[2]}
function amount(x){x=String(x).replace(/[$\s]/g,'');return Number(/^\d+,\d{2}$/.test(x)?x.replace(',','.'):x.replace(/,/g,''))}
function prices(x){var a=[],re=/\$?\s*(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2}|\d+,\d{2})(?!\d)/g,m;while((m=re.exec(x)))a.push({value:amount(m[1]),at:m.index});return a}
var totalLines=[],tax=[],discount=[];
lines.forEach(function(x,i){var p=prices(x);if(!p.length)return;var v=p[p.length-1].value;if(/\b(grand total|total due|amount due|total paid|balance due|total\b|importe total|monto total)\b/i.test(x)&&!/\b(subtotal|sub total|total savings|total items|total tax|total discount)\b/i.test(x))totalLines.push({value:v,rank:/grand total|total due|amount due/i.test(x)?2:1,index:i});if(/\b(tax|impuesto|iva)\b/i.test(x)&&!/\b(tax id|taxable)\b/i.test(x))tax.push(v);if(/\b(discount|coupon|descuento)\b/i.test(x))discount.push(v)});
totalLines.sort(function(a,b){return b.rank-a.rank||b.index-a.index});if(totalLines.length)out.total=totalLines[0].value;
if(tax.length)out.tax=tax[tax.length-1];if(discount.length)out.discount=discount.reduce(function(a,b){return a+b},0);
var ignore=/\b(total|subtotal|sub total|tax|impuesto|descuento|discount|coupon|change|cash|credit|visa|debit|mastercard|balance|payment|receipt|invoice|factura|gracias|thank|saving|store|phone|cashier|shipping|delivery|authorization|card|transaction|reward|loyalty|points|items sold)\b/i;
lines.forEach(function(line){if(ignore.test(line)||out.items.length>=80)return;var amounts=prices(line);if(!amounts.length)return;var final=amounts[amounts.length-1],prefix=line.slice(0,final.at).trim();if(!/[a-zÀ-ÿ]{2}/i.test(prefix)||prefix.length<3||final.value>10000)return;
var quantity=1,unit=final.value,name=prefix;var q=prefix.match(/^(\d{1,2})(?:\s*[xX]\s*|\s+)(.+)/);if(q&&Number(q[1])<=50){quantity=Number(q[1]);name=q[2]}
var inline=name.match(/^(.+?)\s+(\d{1,2})\s*[xX@]\s*\$?(\d+(?:[.,]\d{2})?)/);
if(inline){name=inline[1];quantity=Number(inline[2]);var un=amount(inline[3]);if(Math.abs(un*quantity-final.value)<.06)unit=un}
var prev=amounts.length>1?amounts[amounts.length-2].value:0;if(quantity>1){if(prev&&Math.abs(prev*quantity-final.value)<.06)unit=prev;else if(Math.abs(unit*quantity-final.value)>.06)unit=Math.round(final.value/quantity*100)/100}
name=name.replace(/^\d{4,}\s+/,'').replace(/\s+(?:T|F|A|X)$/,'').trim();if(name.length<3)return;
out.items.push({name:name.slice(0,100),qty:quantity,price:unit})});
var calculated=out.items.reduce(function(a,x){return a+x.qty*x.price},0)+out.tax-out.discount;
if(out.total===null)out.warnings.push('No se pudo detectar el total.');
if(!out.items.length)out.warnings.push('No se detectaron productos.');
if(out.total!==null&&out.items.length&&Math.abs(calculated-out.total)>.15)out.warnings.push('Los productos detectados no suman el total: revisa cantidades y precios.');
return out}
function applyOCR(raw){
var r=getForm();syncItems();var p=parseOCR(raw);
if(p.store)r.store=p.store;if(p.date)r.date=p.date;if(p.time)r.time=p.time;
if(p.total!==null)r.total=p.total;if(p.tax)r.tax=p.tax;if(p.discount)r.discount=p.discount;
if(p.items.length)items=p.items;editing=Object.assign({},editing||{},r,{ocrText:raw,ocrWarnings:p.warnings});render();
scanStatus('Lectura terminada. Revisa todos los importes y corrige lo necesario.');
toast(p.warnings.length?'Se detectaron datos por revisar. Consulta las advertencias.':'Texto reconocido. Confirma los importes.')}
async function scan(){
if(busy)return;var file=attachment||editing&&editing.fileBlob;if(!file){toast('Primero selecciona una imagen o PDF.');return}
busy=true;var button=document.getElementById('scan');if(button)button.disabled=true;
try{scanStatus('Leyendo archivo…');var source=file,raw='';
if((file.type||'').includes('pdf')||/\.pdf$/i.test(file.name||'')){
if(!window.pdfjsLib)throw new Error('No se pudo cargar el lector de PDF');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,parts=[];
for(var n=1;n<=Math.min(pdf.numPages,3);n++){var pg=await pdf.getPage(n),ct=await pg.getTextContent(),rows={};ct.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3)*3;(rows[y]||(rows[y]=[])).push({x:it.transform[4],s:it.str})});parts.push(Object.keys(rows).map(Number).sort(function(a,b){return b-a}).map(function(y){return rows[y].sort(function(a,b){return a.x-b.x}).map(function(x){return x.s}).join(' ')}).join('\n'))}
raw=parts.join('\n');
if(raw.replace(/\s/g,'').length<50){raw='';var page=await pdf.getPage(1),v=page.getViewport({scale:2.1}),canvas=document.createElement('canvas');canvas.width=v.width;canvas.height=v.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise;source=canvas}
if(pdf.numPages>3)toast('Se procesaron solo las tres primeras páginas; revisa el resto.')}
if(!raw){
if(!window.Tesseract)throw new Error('No se pudo cargar el lector de fotografías');
var result;try{result=await Tesseract.recognize(source,'eng+spa',{logger:function(x){if(x.status==='recognizing text')scanStatus('Leyendo texto… '+Math.round((x.progress||0)*100)+'%')}})}catch(e){scanStatus('Probando lectura alternativa…');result=await Tesseract.recognize(source,'eng')}
raw=result.data.text||''}
if(!raw.trim())throw new Error('El archivo no contiene texto reconocible');
applyOCR(raw)
}catch(e){fail(e);scanStatus('No se pudo leer. Puedes registrar la factura manualmente.')}
finally{busy=false;var b=document.getElementById('scan');if(b)b.disabled=false}
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function download(blob,name){var a=document.createElement('a');var url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000)}
function exportCsv(){
var ctx=reportContext(),rows=[['FROM HOME — CONTROL DE GASTOS'],['Informe',ctx.title],['Desde',ctx.from],['Hasta',ctx.to],['Total gastado',sum(ctx.rows).toFixed(2)],[],['Fecha','Hora','Comercio','Categoria','Producto','Cantidad','Precio unitario','Subtotal producto','Impuesto factura','Descuento factura','Total factura','Notas']];
ctx.rows.forEach(function(r){(r.items&&r.items.length?r.items:[{name:'',qty:'',price:''}]).forEach(function(i){rows.push([r.date,r.time,r.store,r.category,i.name,i.qty,i.price,(num(i.qty)*num(i.price)).toFixed(2),r.tax,r.discount,r.total,r.note])})});
download(new Blob(['\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')],{type:'text/csv;charset=utf-8'}),'From_Home_Gastos_'+ctx.from+'_a_'+ctx.to+'.csv');toast('Informe CSV descargado')
}
async function exportPdf(){
if(!window.jspdf){toast('El generador de PDF todavía no cargó. Revisa internet.');return}
try{
var ctx=reportContext(),doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),y=47,rows=ctx.rows;
try{var img=document.querySelector('.brand img');var c=document.createElement('canvas');c.width=240;c.height=240;c.getContext('2d').drawImage(img,0,0,240,240);doc.addImage(c.toDataURL('image/jpeg'),'JPEG',13,7,32,32)}catch(e){}
doc.setFontSize(15);doc.text('FROM HOME | CONTROL DE GASTOS',50,17);
doc.setFontSize(9);doc.text('Informe: '+ctx.title.slice(0,70),50,24);
doc.text('Periodo: '+fmtDate(ctx.from)+' al '+fmtDate(ctx.to),50,30);
doc.text('Gasto total: '+money(sum(rows))+'   |   Compras: '+rows.length,50,37);
doc.setDrawColor(230,210,195);doc.line(13,42,197,42);
function line(t,size){size=size||10;var wrapped=doc.splitTextToSize(String(t),180),height=wrapped.length*5+2;if(y+height>280){doc.addPage();y=18}doc.setFontSize(size);doc.text(wrapped,14,y);y+=height}
var stores={},categoriesSum={};rows.forEach(function(r){stores[r.store]=(stores[r.store]||0)+num(r.total);categoriesSum[r.category||'Otros']=(categoriesSum[r.category||'Otros']||0)+num(r.total)});
line('RESUMEN POR COMERCIO',11);Object.keys(stores).sort().forEach(function(s){line('  '+s+': '+money(stores[s]),9)});
y+=2;line('RESUMEN POR CATEGORIA',11);Object.keys(categoriesSum).sort().forEach(function(s){line('  '+s+': '+money(categoriesSum[s]),9)});
y+=3;line('DETALLE DE GASTOS',11);
rows.forEach(function(r){line(fmtDate(r.date)+' '+(r.time||'')+' | '+r.store+' | '+money(r.total),10);line('  Categoria: '+(r.category||'Otros')+' | Impuestos: '+money(r.tax)+' | Descuentos: '+money(r.discount),8);(r.items||[]).forEach(function(i){line('    - '+i.name+' | '+i.qty+' x '+money(i.price)+' = '+money(i.qty*i.price),9)});y+=2});
if(!rows.length)line('No se registraron compras durante este periodo.',10);
doc.save('From_Home_Informe_'+ctx.from+'_a_'+ctx.to+'.pdf');toast('Informe PDF descargado')
}catch(e){fail(e)}
}
async function backup(){try{var z=[];for(var r of all){var v=Object.assign({},r);if(v.fileBlob){var b=v.fileBlob;v.fileBase64=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=function(){reject(reader.error)};reader.readAsDataURL(b)});delete v.fileBlob}z.push(v)}download(new Blob([JSON.stringify({app:'From Home Control de Gastos',version:1,receipts:z,reports:savedReports})],{type:'application/json'}),'From_Home_Respaldo_'+today()+'.json');toast('Respaldo descargado')}catch(e){fail(e)}}
async function restore(file){if(!file)return;if(!confirm('¿Restaurar este respaldo? Los registros con el mismo identificador serán reemplazados.'))return;try{var data=JSON.parse(await file.text());if(!data||!Array.isArray(data.receipts)||data.version!==1)throw new Error('Formato de respaldo no válido');for(var r of data.receipts){if(!r.id||!r.date||!Array.isArray(r.items))continue;if(r.fileBase64){var resp=await fetch(r.fileBase64);r.fileBlob=await resp.blob();delete r.fileBase64}await op('put',r)}if(Array.isArray(data.reports)){savedReports=data.reports.filter(function(x){return x&&x.id&&x.from&&x.to&&x.title});persistReports()}await refresh();toast('Respaldo restaurado')}catch(e){fail(e)}}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b)setview(b.dataset.view)});
document.getElementById('page').addEventListener('change',function(e){if(e.target.id==='month'){month=e.target.value;activeReportId=null;render()}else if(e.target.id==='restore')restore(e.target.files[0])});
document.getElementById('page').addEventListener('click',async function(e){var t=e.target,b=t.closest('button'),id=b&&b.id;if(!b)return;
if(id==='saveReport'){var from=document.getElementById('reportFrom').value,to=document.getElementById('reportTo').value,title=document.getElementById('reportTitle').value.trim();if(!from||!to||from>to){toast('Selecciona un período válido: la fecha inicial no puede ser posterior a la final.');return}if(!title)title='Gastos del '+fmtDate(from)+' al '+fmtDate(to);var custom={id:'i'+Date.now()+Math.random().toString(36).slice(2),title:title,from:from,to:to};savedReports.push(custom);persistReports();activeReportId=custom.id;render();toast('Informe guardado. Puedes verlo y descargarlo.')}
else if(id==='fillToday'){document.getElementById('reportFrom').value=today();document.getElementById('reportTo').value=today();document.getElementById('reportTitle').value='Gastos de hoy'}
else if(id==='fillWeekend'){var dates=weekendDates();document.getElementById('reportFrom').value=dates.from;document.getElementById('reportTo').value=dates.to;document.getElementById('reportTitle').value='Gastos del fin de semana'}
else if(id==='fillMonth'){var c=reportContext();document.getElementById('reportFrom').value=month+'-01';document.getElementById('reportTo').value=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5,7)),0)).toISOString().slice(0,10);document.getElementById('reportTitle').value='Gastos de '+monthLabel(month)}
else if(b.dataset.reportOpen){activeReportId=b.dataset.reportOpen;render()}
else if(b.dataset.reportRemove){if(confirm('¿Eliminar este informe guardado? Las facturas originales no se borrarán.')){savedReports=savedReports.filter(function(x){return x.id!==b.dataset.reportRemove});if(activeReportId===b.dataset.reportRemove)activeReportId=null;persistReports();render();toast('Informe eliminado; las facturas siguen guardadas.')}}
else if(id==='monthlyReport'){activeReportId=null;render()}
else if(id==='newReceipt'){openEditor(null)}
else if(b.dataset.edit){openEditor(all.find(function(r){return r.id===b.dataset.edit}))}
else if(id==='cancel'){attachment=null;editing=null;setview('receipts')}
else if(id==='addItem'){syncItems();items.push({name:'',qty:1,price:0});var v=getForm();editing=Object.assign({},editing||{},v);render()}
else if(b.dataset.remove!==undefined){syncItems();items.splice(Number(b.dataset.remove),1);editing=Object.assign({},editing||{},getForm());render()}
else if(id==='reparse'){var raw=document.getElementById('ocrText').value;if(raw.trim())applyOCR(raw);else toast('No hay texto que analizar')}
else if(id==='save'){await save()}
else if(id==='scan'){await scan()}
else if(id==='viewFile'){var f=attachment||editing&&editing.fileBlob;if(f){var u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(function(){URL.revokeObjectURL(u)},60000)}}
else if(id==='delete'&&editing&&confirm('¿Eliminar esta factura definitivamente?')){await op('delete',editing.id);attachment=null;editing=null;view='receipts';await refresh();toast('Factura eliminada')}
else if(id==='csv'){exportCsv()}else if(id==='pdf'){await exportPdf()}else if(id==='backup'){await backup()}});
dbOpen().then(refresh).catch(function(e){document.getElementById('page').innerHTML='<div class="notice">No se pudo abrir el almacenamiento local. Prueba abrir la página en un navegador normal, fuera del modo privado.</div>';fail(e)});
})();
</script></body></html>
